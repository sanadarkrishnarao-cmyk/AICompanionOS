plugins {
    id 'com.android.application'
}

android {
    namespace 'com.myai.companion'
    compileSdk 33

    defaultConfig {
        applicationId "com.myai.companion"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
